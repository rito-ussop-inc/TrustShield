version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trustshield
      POSTGRES_PASSWORD: trustshield
      POSTGRES_DB: trustshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://trustshield:trustshield@db:5432/trustshield
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  pgdata:
